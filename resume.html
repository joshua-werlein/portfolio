<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ─────────────────────────────────────────────────── -->
    <title>Joshua Werlein — Resume</title>
    <meta name="description" content="Resume of Joshua Werlein, Full-Stack Software Engineer. Production experience with Cloudflare Workers, Astro, React, native Android (Java), and serverless infrastructure." />
    <meta name="author" content="Joshua Werlein" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://joshuawerlein.com/resume" />

    <!-- ── Open Graph ─────────────────────────────────────────────────── -->
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://joshuawerlein.com/resume" />
    <meta property="og:title" content="Joshua Werlein — Resume" />
    <meta property="og:description" content="Full-Stack Software Engineer. Production experience with Cloudflare, Astro, React, and native Android (Java). Open to remote opportunities." />
    <meta property="og:image" content="https://joshuawerlein.com/og-image.jpg" />
    <meta property="og:site_name" content="Joshua Werlein" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter / X Card ───────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://joshuawerlein.com/resume" />
    <meta name="twitter:title" content="Joshua Werlein — Resume" />
    <meta name="twitter:description" content="Full-Stack Software Engineer. Production experience with Cloudflare, Astro, React, and native Android (Java)." />
    <meta name="twitter:image" content="https://joshuawerlein.com/og-image.jpg" />

    <!-- ── Favicon ─────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ── Theme color ────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#f4f4f8" />

    <!-- ── Anti-flash theme init ─────────────────────────────────────── -->
    <script>
      (function() {
        var t = localStorage.getItem('portfolio-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/resume-main.jsx"></script>
  </body>
</html>
